services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.local
    container_name: lims-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lims

  nginx:
    image: nginx:1.27-alpine
    container_name: lims-nginx
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lims

  node:
    image: node:22-alpine
    container_name: lims-node
    working_dir: /var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port ${VITE_DEV_SERVER_PORT:-5173}"
    ports:
      - "${VITE_DEV_SERVER_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - lims

networks:
  lims:
    driver: bridge

volumes:
  node_modules:
